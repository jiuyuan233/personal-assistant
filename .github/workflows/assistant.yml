name: 个人助手

# ★ 只有一条 cron（审计 §4.1）。原来 8 条各自映射一个模式，实测出现过连续
#   1 小时 33 分钟一次都没触发：GitHub 对同一 workflow 的 schedule 有节流，
#   条数越多越容易被丢；并发组又只保留一个 pending，手动派发会把定时班挤掉。
#   现在频率由 scripts/main.py 的 do_tick() 按 data/runtime.json 里的时间戳决定：
#     study 每 60 分钟 · diary 每 120 分钟 · notice 每 360 分钟 · finalize 每轮
#     飞书 07:00 / 12:00 / 22:00（北京时间），每天各一次；补发窗口 morning/noon 5h、night 2h
#   凌晨写回窗口内当天还没写回时，tick 会强制加跑一次 diary。
#
# ★ 降噪（用户 2026-11-14）：常规成功不再发状态卡片。飞书步骤只在
#   「失败/取消」或「日志里有 [urgent]（24h 内截止且集合有变化）」时才发状态卡；
#   三时段推送照发，那是用户明确要的。判定在 scripts/notify_feishu.js 里。
#
# ⚠️ 额度：Actions 按「每个 job 向上取整到分钟」计费。20 分钟一次 = 72 轮/天 ≈ 2160 分钟/月，
#    已经超过私有仓库的 2000 分钟免费额度。所以本默认配置要求 **public 仓库或 self-hosted runner**。
#    必须用 private + GitHub 托管 runner 的话，见 DEV_GUIDE.md 第 2 节的「省额度做法」：
#    只有两个旋钮 —— 把这一条 cron 改慢（*/30 等），和调大 main.TICK_INTERVALS。不要再加 cron。
on:
  schedule:
    # ★ 非准点错峰（用户 2026-11-14 决定）：分钟 7-59/20 = 每小时的 :07 / :27 / :47。
    #   不用 */20（:00/:20/:40）是为了避开整点高峰 —— GitHub 官方文档明确说
    #   schedule 在高负载时段（尤其每小时开头）会被延迟或丢弃。
    #   推送时刻跟着轮次自然错峰：PUSH_HOURS 目标仍是 7/12/22 整点，
    #   实际发送落在目标后的第一个轮次（07:07 / 12:07 / 22:07），不再撞整点。
    #   轮次间隔仍是 20 分钟，do_tick() 的调度逻辑不受相位影响。
    - cron: '7-59/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'tick'
        type: choice
        options:
          - tick
          - finalize
          - diary
          - study
          - notice
          - schedule
          - all
          - backfill
          - probe
          - studydiag
          - selftest
          - morning
          - noon
          - night

permissions:
  contents: write

# 全仓库只有一个并发组：同一时刻只跑一个，排队而不是取消（取消会丢掉采集结果）。
# 拆成 push / collect 两组反而会让采集和渲染同时改 README，rebase 必冲突。
# ⚠️ 并发组只保留一个 pending，批量派发多个模式会互相挤掉，必须串行派发。
# job 上的 timeout-minutes 是兜底：一个卡死的 run 会堵住整条队列。
concurrency:
  group: pa-run
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: '1'
  TASK_LOG_PATH: /tmp/task-output.log

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 必须显式给 ref：默认检出的是 github.sha（派发那一刻的 HEAD），
          # 排队期间别的 run 推了新提交，本 run 仍在旧树上渲染，rebase 必冲突。
          ref: ${{ github.ref_name }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装 Node（飞书推送用）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install ruff

      - name: 决定模式
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            MODE=tick
          fi
          case "$MODE" in
            morning|noon|night) PUSH=true ;;
            *)                  PUSH=false ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "本次模式：$MODE（触发方式 $EVENT_NAME）"

      # 质量门禁（审计 §4.4）。放在执行之前：静态检查 + 离线自检不过就不采集，
      # 免得带着 NameError 跑一整轮登录链，最后静默写出空数据。
      # F821（未定义名字）这一条就能抓住「用了 BJ_TZ 却忘了 import」这类事故。
      - name: 质量门禁
        env:
          # 门禁也要注入黑名单，否则「私人路径不出现在仓库任何文件里」这条守卫
          # 只在派发 selftest 时才跑，普通 tick 永远跳过 —— 等于平时没有守卫。
          DIARY_EXCLUDE: ${{ secrets.DIARY_EXCLUDE }}
        run: |
          ruff check scripts --select E9,F63,F7,F82,F821,F401
          python scripts/main.py selftest

      - name: 执行
        id: execute
        env:
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.chatanywhere.org/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v3.2' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CX_USERNAME: ${{ secrets.CX_USERNAME }}
          CX_PASSWORD: ${{ secrets.CX_PASSWORD }}
          # 私人日记路径黑名单。值只存在于 Secret，仓库里只出现这个名字（审计 §2.2/§7.3）。
          DIARY_EXCLUDE: ${{ secrets.DIARY_EXCLUDE }}
          # 飞书自建应用凭证：只为把二次元图上传成 image_key 内嵌进卡片。
          # 没配也能推送 —— anime_image.upload() 直接返回空，卡片退化成「点开看图」按钮。
          FS_APP_ID: ${{ secrets.FS_APP_ID }}
          FS_APP_SECRET: ${{ secrets.FS_APP_SECRET }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -o pipefail
          : > /tmp/task-output.log
          # 三个文件都必须先删：上一轮的残留会让这一轮误发旧文案/旧图/旧紧急提醒。
          rm -f /tmp/push-message.txt /tmp/push-image.json /tmp/push-urgent.txt
          python scripts/main.py "$MODE" 2>&1 | tee -a /tmp/task-output.log

      - name: 提交数据
        # probe / selftest / studydiag 不产生数据，三时段推送只读 data/ 不写，都跳过提交
        if: steps.mode.outputs.push != 'true' && steps.mode.outputs.mode != 'probe' && steps.mode.outputs.mode != 'selftest' && steps.mode.outputs.mode != 'studydiag'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$MODE" in
            tick|finalize|all)
              git add data docs README.md
              ;;
            *)
              # 采集模式只提交自己采到的 data。README/docs 是派生产物，统一交给 finalize，
              # 否则两个模式各自渲染同一份 README，rebase 必冲突并丢掉采集结果。
              git add data
              git checkout -- README.md docs
              ;;
          esac
          if git diff --cached --quiet; then
            echo "无更新，跳过提交"
          else
            git commit -m "chore(data): ${MODE} update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # 不用 force push。推不上去就让这一步失败，飞书会报红，人来处理。
            git pull --rebase origin "$REF_NAME"
            git push origin "$REF_NAME"
          fi

      - name: 飞书通知
        if: always()
        env:
          FS_WEBHOOK: ${{ secrets.FS_WEBHOOK }}
          NOTIFY_TITLE: 个人助手
          NOTIFY_TASK: ${{ steps.mode.outputs.mode }}
          # 三时段推送的卡片标题靠它区分早/中/晚；采集模式为空，走状态卡片分支。
          NOTIFY_KIND: ${{ steps.mode.outputs.mode }}
          # 必须是 job.status，不是 steps.execute.outcome：
          # git push 在「提交数据」那一步，推送失败时 execute.outcome 仍是 success，
          # 用户会收到一张绿卡而数据根本没上去（审计 §1.3）。
          NOTIFY_STATUS: ${{ job.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          export NOTIFY_OUTPUT="$(tail -200 /tmp/task-output.log 2>/dev/null)"
          # 三时段推送：daily_push.py 把「AI 人话 + 确定性清单」写进 push-message.txt，
          # anime_image.py 把图的信息写进 push-image.json。两个都在 → 发带图/带按钮的卡片；
          # 只有文案 → 纯文本；卡片被飞书拒收 → 脚本自己退回纯文本重发。
          # 文件不存在（采集模式，或推送模式在写文案前就崩了）就走状态卡片，失败照样报红。
          sent_any=0
          if [ -s /tmp/push-message.txt ]; then
            node scripts/notify_feishu.js "$(cat /tmp/push-message.txt)"
            sent_any=1
          fi
          if [ -s /tmp/push-urgent.txt ]; then
            # 6 小时紧急截止提醒（用户 2026-11-14）：独立于三时段与降噪闸门，
            # 即使常规成功也必达，与三时段同轮时两条都发（elif 会吞掉紧急提醒且
            # 记账已写导致永久丢失，所以是两个独立 if）。纯文本（链接可点）。
            NOTIFY_KIND=urgent node scripts/notify_feishu.js "$(cat /tmp/push-urgent.txt)"
            sent_any=1
          fi
          if [ "$sent_any" = 0 ]; then
            node scripts/notify_feishu.js
          fi