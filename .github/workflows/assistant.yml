name: 个人助手

# 模式分频：finalize 每 20 分钟（零网络零 token），采集各自独立频率。
# 登录类任务失败不会拖累渲染。
#
# ⚠️ 额度：Actions 按「每个 job 向上取整到分钟」计费。20 分钟一次 = 2160 次/月 = 至少 2160 分钟，
#    已经超过私有仓库的 2000 分钟免费额度。所以本默认配置要求 **public 仓库或 self-hosted runner**。
#    必须用 private + GitHub 托管 runner 的话，见 DEV_GUIDE.md 第 2 节的「省额度 cron 组合」。
on:
  schedule:
    - cron: '*/20 * * * *'      # finalize：渲染 README + SVG + 离线重算课表
    - cron: '7 0,4,8,12 * * *'  # diary：Gitee 日记增量，北京时间 08/12/16/20 点（日记一天最多改一次）
    - cron: '13 * * * *'        # study：学习通全量四步链
    - cron: '17 1,7,13 * * *'   # notice：公开公告站，北京时间 09:17 / 15:17 / 21:17
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'finalize'
        type: choice
        options:
          - finalize
          - diary
          - study
          - notice
          - schedule
          - all
          - probe
          - selftest

permissions:
  contents: write

# 同一时刻只跑一个，排队而不是取消 —— 取消会丢掉采集结果
concurrency:
  group: personal-assistant
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: '1'
  TASK_LOG_PATH: /tmp/task-output.log

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 必须显式给 ref：默认检出的是 github.sha（派发那一刻的 HEAD），
          # 排队期间别的 run 推了新提交，本 run 仍在旧树上渲染，rebase 必冲突。
          ref: ${{ github.ref_name }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装 Node（飞书推送用）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 决定模式
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            # 用 cron 表达式本身判定，而不是当前分钟 —— Actions 经常延迟几分钟触发
            case "$SCHEDULE" in
              '*/20 * * * *')    MODE=finalize ;;
              '7 0,4,8,12 * * *') MODE=diary ;;
              '13 * * * *')      MODE=study ;;
              '17 1,7,13 * * *') MODE=notice ;;
              *)                 MODE=finalize ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式：$MODE（触发方式 $EVENT_NAME）"

      - name: 执行
        id: execute
        env:
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.chatanywhere.org/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v3.2' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CX_USERNAME: ${{ secrets.CX_USERNAME }}
          CX_PASSWORD: ${{ secrets.CX_PASSWORD }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -o pipefail
          : > /tmp/task-output.log
          python scripts/main.py "$MODE" 2>&1 | tee -a /tmp/task-output.log

      - name: 提交数据
        # probe / selftest 不产生数据，跳过提交
        if: steps.mode.outputs.mode != 'probe' && steps.mode.outputs.mode != 'selftest'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$MODE" in
            finalize|all)
              git add data docs README.md
              ;;
            *)
              # 采集模式只提交自己采到的 data。README/docs 是派生产物，统一交给 finalize，
              # 否则两个模式各自渲染同一份 README，rebase 必冲突并丢掉采集结果。
              git add data
              git checkout -- README.md docs
              ;;
          esac
          if git diff --cached --quiet; then
            echo "无更新，跳过提交"
          else
            git commit -m "chore(data): ${MODE} update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # 不用 force push。推不上去就让这一步失败，飞书会报红，人来处理。
            git pull --rebase origin "$REF_NAME"
            git push origin "$REF_NAME"
          fi

      - name: 飞书通知
        if: always()
        env:
          FS_WEBHOOK: ${{ secrets.FS_WEBHOOK }}
          NOTIFY_TITLE: 个人助手
          NOTIFY_TASK: ${{ steps.mode.outputs.mode }}
          NOTIFY_STATUS: ${{ steps.execute.outcome }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          export NOTIFY_OUTPUT="$(tail -200 /tmp/task-output.log 2>/dev/null)"
          node scripts/notify_feishu.js