name: 接力器

# ★ 仓库内自续链（用户 2026-11-15 要求「定时任务不能外包，在仓库里也要做一套」）：
#   assistant.yml 的每轮 run 结束时 dispatch 本接力器 → 本接力器睡 19.5 分钟 →
#   再触发下一轮 tick + 下一棒接力。三路触发并存（接力链 / cron-job.org / GitHub schedule），
#   `pushed[kind]` 按日期记账保证**绝不重复推送**（谁先触发谁发，后到的自动跳过）。
#
# 防失控三道闸（改动前先理解，别拆）：
# 1. 独立并发组 pa-relay + cancel-in-progress: true —— 无论 dispatch 几条链，
#    同一时刻只剩一个 relay 在跑（后到的取消先到的），链条数恒 ≤1；
# 2. tick 走 pa-run 串行组（cancel-in-progress: false 排队）+ pushed 记账 —— 重复触发无害；
# 3. 本接力器睡到一半被取消也没关系：cron-job.org / GitHub schedule 两路兜底，
#    任何一次 assistant.yml 的 run 结尾都会重新接力，链自动重建。
#
# 额度：public 仓库 Actions 免费。relay 每 ~20 分钟一个 run（睡 19.5 分钟），
# 属「 sleeps most of the time」的轻量 job。仓库转 private 前先看 DEV_GUIDE 的省额度做法。

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: pa-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: 睡 19.5 分钟（接力间隔；tick 每 20 分钟一班的节奏由此维持）
        run: |
          for i in $(seq 1 39); do
            sleep 30
            echo "relay ${i}/39"
          done

      - name: 触发下一轮 tick + 下一棒接力
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # workflow_dispatch 是 GITHUB_TOKEN 能触发新 run 的官方例外事件
          # （其他事件会被防递归机制拦掉），所以不需要任何 PAT。
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/assistant.yml/dispatches" \
            -d '{"ref":"main","inputs":{"mode":"tick"}}' -w "tick-dispatch HTTP %{http_code}\n"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/relay.yml/dispatches" \
            -d '{"ref":"main"}' -w "relay-dispatch HTTP %{http_code}\n"
